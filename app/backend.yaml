# Setup Guide — Step 7: Deploy Sample Services
# Apply to: cluster-02 (ACCEPTOR)
#
# Deploys the backend sample service (nicholasjackson/fake-service) for
# cross-cluster connectivity verification. This is a lightweight test service —
# replace with your own application once peering is confirmed working.
#
# The connect-inject annotation triggers Envoy sidecar injection.
# The pod will show 2/2 containers when Consul injection is working correctly.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
spec:
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 9090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: default
---
# Deployment for backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        "consul.hashicorp.com/connect-inject": "true"
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: nicholasjackson/fake-service:v0.22.4
          ports:
            - containerPort: 9090
          env:
            - name: "LISTEN_ADDR"
              value: "0.0.0.0:9090"
            - name: "NAME"
              value: "backend"
            - name: "MESSAGE"
              value: "Response from backend"
