# Phase 2a — Peering Acceptor
# Apply to: cluster2 (ACCEPTOR)
#
# Creates a peering endpoint on cluster2. The Consul controller generates a
# one-time peering token and stores it in the Kubernetes Secret below.
#
# After applying, wait for the secret to be populated:
#   kubectl --context=cluster2 wait secret/peering-token -n consul \
#     --for=jsonpath='{.data.data}' --timeout=60s
#
# Then copy the token to cluster1 (see runbook.sh token-copy phase).
apiVersion: consul.hashicorp.com/v1alpha1
kind: PeeringAcceptor
metadata:
  # This name becomes the peering identifier from cluster2's perspective.
  # cluster1 configs (ExportedServices consumers, ServiceIntentions peer field)
  # will reference cluster1 using the PeeringDialer name — NOT this name.
  name: cluster2
  namespace: consul
spec:
  peer:
    secret:
      # The controller creates/updates this Secret with the generated token.
      # Copy this Secret to the consul namespace on cluster1 before
      # applying the PeeringDialer.
      name: "peering-token"
      key: "data"
      backend: "kubernetes"
