# Phase 2a — Peering Acceptor
# Apply to: cluster-02 (ACCEPTOR)
#
# Creates a peering endpoint on cluster-02. The Consul controller generates a
# one-time peering token and stores it in the Kubernetes Secret below.
#
# After applying, wait for the secret to be populated:
#   kubectl --context=cluster-02 wait secret/peering-token -n consul \
#     --for=jsonpath='{.data.data}' --timeout=60s
#
# Then copy the token to cluster-01 (see runbook.sh token-copy phase).
apiVersion: consul.hashicorp.com/v1alpha1
kind: PeeringAcceptor
metadata:
  # This name becomes the peering identifier from cluster-02's perspective.
  # cluster-01 configs (ExportedServices consumers, ServiceIntentions peer field)
  # will reference cluster-01 using the PeeringDialer name — NOT this name.
  name: cluster-02
  namespace: consul
spec:
  peer:
    secret:
      # The controller creates/updates this Secret with the generated token.
      # Copy this Secret to the consul namespace on cluster-01 before
      # applying the PeeringDialer.
      name: "peering-token"
      key: "data"
      backend: "kubernetes"
