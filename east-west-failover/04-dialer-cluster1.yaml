# Phase 2c — Peering Dialer
# Apply to: cluster1 (DIALER)
#
# PREREQUISITE: The peering-token Secret must already exist in the consul
# namespace on cluster1. See the token-copy phase in runbook.sh.
#
# Initiates the peering connection from cluster1 to cluster2 using the
# token generated by the PeeringAcceptor.
apiVersion: consul.hashicorp.com/v1alpha1
kind: PeeringDialer
metadata:
  # This name identifies the peering from cluster1's perspective AND is the
  # name that cluster2 uses to reference cluster1 in peer-aware configs:
  #   - ExportedServices.spec.services[].consumers[].peer
  #   - ServiceIntentions.spec.sources[].peer
  # Both must reference "cluster1" (this value) to match.
  name: cluster1
  namespace: consul
spec:
  peer:
    secret:
      # Must match the Secret copied from cluster2 in the token-copy phase.
      name: "peering-token"
      key: "data"
      backend: "kubernetes"
