# Phase 4b — Service Intentions
# Apply to: cluster-02 (ACCEPTOR)
#
# Default-deny all traffic to backend, then explicitly allow only the
# frontend service running on cluster-01 to connect.
#
# Without this allow intention, Consul's default-deny ACL policy blocks
# all cross-cluster connections even after peering is established.
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: backend
  namespace: consul
spec:
  destination:
    name: backend
  sources:
    - name: "*"
      # Deny all sources by default. This makes the explicit allow below
      # the only permitted path to backend.
      action: deny
    - name: frontend
      # Allow only the frontend service from the cluster-01 peer.
      # "peer" must match PeeringDialer.metadata.name on cluster-01.
      action: allow
      peer: cluster-01
