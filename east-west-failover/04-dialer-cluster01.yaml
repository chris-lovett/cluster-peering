# Phase 2c — Peering Dialer
# Apply to: cluster-01 (DIALER)
#
# PREREQUISITE: The peering-token Secret must already exist in the consul
# namespace on cluster-01. See the token-copy phase in runbook.sh.
#
# Initiates the peering connection from cluster-01 to cluster-02 using the
# token generated by the PeeringAcceptor.
apiVersion: consul.hashicorp.com/v1alpha1
kind: PeeringDialer
metadata:
  # This name identifies the peering from cluster-01's perspective AND is the
  # name that cluster-02 uses to reference cluster-01 in peer-aware configs:
  #   - ExportedServices.spec.services[].consumers[].peer
  #   - ServiceIntentions.spec.sources[].peer
  # Both must reference "cluster-01" (this value) to match.
  name: cluster-01
  namespace: consul
spec:
  peer:
    secret:
      # Must match the Secret copied from cluster-02 in the token-copy phase.
      name: "peering-token"
      key: "data"
      backend: "kubernetes"
