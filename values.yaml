global:
  name: consul
  datacenter: dc1
  image: "hashicorp/consul-enterprise:1.22.3-ent"
  imagePullSecrets:
    - name: 19261309-openshift-secret-pull-secret
  peering:
    enabled: true
  openshift:
    enabled: true
  acls:
    manageSystemACLs: true
  tls:
    enabled: true
    enableAutoEncrypt: true
    verify: true
  metrics:
    enabled: true
    enableAgentMetrics: true
    enableGatewayMetrics: true
    agentMetricsRetentionTime: "60s"
    enableTelemetryCollector: true # Prometheus integration
    disableAgentHostName: true
  enterpriseLicense:
    secretName: consul-ent-license
    secretKey: key

meshGateway:
  enabled: true
  wanAddress:
    source: "Service"
    port: 443

server:
  replicas: 1
  bootstrapExpect: 1
  disruptionBudget:
    enabled: true
    maxUnavailable: 0
  extraConfig: |
    {
    "verify_incoming_rpc": true,
    "verify_incoming_https": false,
    "verify_outgoing": true,
    "verify_server_hostname": true
    }

ui:
  enabled: true
  metrics:
    enabled: true
    provider: prometheus
    baseURL: http://prometheus-server.observability.svc.cluster.local
  dashboardURLTemplates:
    service: "https://grafana-observability.apps.rosa.cluster1.6cxo.p3.openshiftapps.com/d/hashicupsnm/consul-service?orgId=1&var-service={{Service.Name}}&var-namespace={{Service.Namespace}}&var-dc={{Datacenter}}"

connectInject:
  enabled: true
  default: true
  metrics:
    defaultEnabled: true
  cni:
    enabled: true
    logLevel: info
    multus: true
    cniBinDir: /var/lib/cni/bin
    cniNetDir: /etc/kubernetes/cni/net.d
  transparentProxy:
    defaultEnabled: true
  apiGateway:
    managedGatewayClass:
      serviceType: LoadBalancer
